# The ready-made image; this file is all you need next to your .env (see the README).
# Development (build from source, dev tooling, mounted plugins and APK) is in compose.dev.yaml.
services:
  app:
    image: ghcr.io/bennyborn/my-own-jdownloader:${APP_VERSION:-latest}
    ports:
      - "${APP_PORT:?set APP_PORT in .env}:3000"
    env_file: .env
    environment:
      PORT: 3000
    restart: unless-stopped
    volumes:
      - icon_cache:/app/data
      # Your own plugins (optional, restart to pick them up): they add to the bundled ones, see the README.
      # - ./plugins:/app/plugins-extra:ro

volumes:
  icon_cache:
